apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis-mcp.fullname" . }}
  labels:
    {{- include "aegis-mcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "aegis-mcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
# Governing headless Service required by the StatefulSet (stable pod DNS).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis-mcp.fullname" . }}-headless
  labels:
    {{- include "aegis-mcp.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    {{- include "aegis-mcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
